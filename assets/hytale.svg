<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#151c2c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- isometric block: top (grass), left (dirt, shaded), right (dirt) -->
  <polygon points="64,26 100,46 64,66 28,46" fill="#6fcf5a"/>
  <polygon points="28,46 64,66 64,106 28,86" fill="#7a4e2c"/>
  <polygon points="100,46 64,66 64,106 100,86" fill="#9a653a"/>
  <!-- grass lip over the side faces -->
  <polygon points="28,46 64,66 64,74 28,54" fill="#4fae43"/>
  <polygon points="100,46 64,66 64,74 100,54" fill="#5cbc4c"/>
  <!-- edge highlights -->
  <polyline points="28,46 64,26 100,46" fill="none" stroke="#a5ec8f" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="28,46 28,86 64,106 100,86 100,46" fill="none" stroke="#3a2415" stroke-width="2.5" stroke-linejoin="round" opacity="0.7"/>
</svg>
